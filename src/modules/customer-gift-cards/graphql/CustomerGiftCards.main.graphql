query CustomerGiftCards {
  customerGiftCards {
    id
    status
    statusHistory {
      status
      createdAt
    }
    giftCard {
      id
      description
      site {
        name
        code
      }
    }
    customer {
      id
      user {
        firstName
        lastName
        email
      }
    }
    giftCardCode
    senderName
    recipientName
    recipientEmail
    message
    createdAt
  }
}
