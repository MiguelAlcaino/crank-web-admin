    name: String!
    value: String!
}

"The signed Payfort tokenization form. Either POST params (plus the card fields, added in the browser) to gatewayUrl, or inject htmlForm — it already carries gatewayUrl as its action."
type LegacyPayfortForm{
    gatewayUrl: String!
    params: [LegacyPayfortFormParam!]!
    htmlForm: String!
}

"The checkout was already completed; poll legacyPaymentStatus."
type LegacyCheckoutAlreadyCompletedError implements Error{
    code: String!
}

"Nothing to charge — complete this checkout with legacyCompleteFreeCheckout instead."
type LegacyNothingToPayError implements Error{
    code: String!
}

union LegacyPayfortFormResultUnion = LegacyPayfortForm|LegacyTemporalTransactionNotFoundError|LegacyOperationNotSupportedForItemError|LegacyCheckoutAlreadyCompletedError|LegacyNothingToPayError|LegacyCheckoutGenericError|LegacyTabbyNotAvailableError|LegacyPhoneNumberRequiredError

enum LegacyPaymentStatusEnum{
    "The gateway has not reported back yet (the customer may still be on the payment page)."
    waitingForPayment
    "The gateway answered (or may still answer successfully); the asynchronous feedback webhook has not finished the purchase yet. Keep polling."
    waitingForConfirmation
    successful
    rejected
}

type LegacyPaymentStatus{
    status: LegacyPaymentStatusEnum!
}

"There is an amount due — this checkout must be paid by card via legacyPayfortForm."
type LegacyCardPaymentRequiredError implements Error{
    code: String!
}

union LegacyPaymentStatusResultUnion = LegacyPaymentStatus|LegacyTemporalTransactionNotFoundError|LegacyCheckoutAlreadyCompletedError|LegacySmsVerificationRequiredError|LegacyOperationNotSupportedForItemError|LegacyCheckoutGenericError|LegacyCardPaymentRequiredError

"A card the customer has stored with the gateway. The gateway token itself is never exposed, and no expiry is stored."
type LegacySavedCard{
    id: ID!
    "Card brand as the gateway reports it, e.g. VISA or MASTERCARD."
    brand: String!
    lastFourDigits: String!
    cardHolderName: String!
}
"The customer's remaining active cards after the change."
type LegacySavedCards{
    cards: [LegacySavedCard!]!
}
type LegacyCreditCardNotFoundError implements Error{
    code: String!
}
union LegacyDeleteSavedCardResultUnion = LegacySavedCards|LegacyCreditCardNotFoundError

input LegacyPayWithSavedCardInput{
    merchantReference: ID!
    creditCardId: ID!
