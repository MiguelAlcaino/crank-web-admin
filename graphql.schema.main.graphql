        @deprecated(reason: "TEMPORARY stop-gap. Delete when KAN-231-shopping-cart-integration merges.")
    "TEMPORARY. Records the anonymous payer's details against a payment-link checkout and returns the signed Payfort tokenization form. No authentication. Card data is appended by the frontend and POSTed straight to Payfort. A payment-link card is never saved: there is no customer to attach it to."
    legacyPaymentLinkPayfortForm(input: LegacyPaymentLinkPayfortFormInput!): LegacyPayfortFormResultUnion!
        @deprecated(reason: "TEMPORARY stop-gap. Delete when KAN-231-shopping-cart-integration merges; replaced by payfortForm.")
