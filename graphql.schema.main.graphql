union LegacyPayWithSavedCardResultUnion = LegacyPaymentStatus|LegacyThreeDSecureRequired|LegacyTemporalTransactionNotFoundError|LegacyCreditCardNotFoundError|LegacyCheckoutAlreadyCompletedError|LegacyNothingToPayError|LegacyCheckoutGenericError

"A payment link as an anonymous payer sees it. Internal fields (the notification address) are never exposed."
